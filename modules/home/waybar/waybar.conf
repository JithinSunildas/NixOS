{
  "layer": "top",
    "position": "top",

    "modules-left": [
      "niri/workspaces",
      "niri/window"
    ],

    "modules-center": [
      "custom/clock"
    ],

    "modules-right": [
    "group/tray-expander",
    "battery",
    "custom/notification",
    "custom/exit"
    ],

    "group/tray-expander": {
      "orientation": "inherit",
      "drawer": {
        "transition-duration": 600,
        "children-class": "tray-group-item"
      },
      "modules": [
        "custom/expand-icon",
      "network",
      "pulseaudio",
      "disk",
      "memory",
      "cpu",
      "tray",
      ]
    },


    "niri/workspaces": {
      "format": "{index}{icon}",
      "format-icons": {
        "default": "",
        "active": "👀"
      }
    },
    "wlr/taskbar": {
      "tooltip-format": "{title} | {app_id}"
    },
    "niri/window": {
      "max-length": 60,
      "separate-outputs": false
    },

    "custom/clock": {
      "exec": "printf '%s %s %s\n' \"$(date +'%b %d')\" \"$(case $(date +%u) in 1) echo 'തിങ്കൾ';; 2) echo 'ചൊവ്വ';; 3) echo 'ബുധൻ';; 4) echo 'വ്യാഴം';; 5) echo 'വെള്ളി';; 6) echo 'ശനി';; 7) echo 'ഞായർ';; esac)\" \"$(date +'%H:%M:%S')\"",
      "interval": 1,
      "format": "{}",
      "tooltip": false,
      "on-click": "waybar-client --tool-tips toggle"
    },

    "memory": {
      "interval": 5,
      "format": "  {}%",
      "tooltip": true,
      "on-click": "/home/tikhaboom/.nix-profile/bin/ghostty -e btop"
    },

    "cpu": {
      "interval": 1,
      "format": "  {usage:2}%",
      "tooltip": true,
      "on-click": "/home/tikhaboom/.nix-profile/bin/ghostty -e btop"
    },

    "disk": {
      "format": "  {free}",
      "tooltip": true
        // "on-click": "/home/tikhaboom/.nix-profile/bin/ghostty -e sh -c df -h ; read"
    },

    "network": {
      "format-icons": [
        "󰤯",
      "󰤟",
      "󰤢",
      "󰤥",
      "󰤨"
      ],
      "format-ethernet": " {bandwidthDownBits}",
      "format-wifi": " {bandwidthDownBits}",
      "format-disconnected": "󰤮",
      "tooltip": true,
      "on-click": "/home/tikhaboom/.nix-profile/bin/ghostty -e nmtui",
      "on-click-right": "nm-connection-editor",
      "interval": 1
    },

    "custom/expand-icon": {
      "format": "ഏ",
      "tooltip": false
    },

    "tray": {
      "icon-size": 12,
      "spacing": 12
    },

    "pulseaudio": {
      "format": "{format_source} {volume}% {icon}",
      "format-bluetooth": "{volume}% {icon} {format_source}",
      "format-bluetooth-muted": " {icon} {format_source}",
      "format-muted": "",
      "format-source": "",
      "format-source-muted": "",
      "format-icons": {
        "headphone": "",
        "hands-free": "",
        "headset": "",
        "phone": "",
        "portable": "",
        "car": "",
        "default": [
          "",
        "",
        ""
        ]
      },
      "on-click": "pavucontrol"
    },

    "custom/exit": {
      "tooltip": false,
      "format": "⏻",
      "on-click": "sleep 0.1 && wlogout"
    },

    "custom/notification": {
      "tooltip": false,
      "format": "{icon}",
      "format-icons": {
        "notification": "<span foreground='red'><sup></sup></span>",
        "none": "",
        "dnd-notification": "<span foreground='red'><sup></sup></span>",
        "dnd-none": "",
        "inhibited-notification": "<span foreground='red'><sup></sup></span>",
        "inhibited-none": "",
        "dnd-inhibited-notification": "<span foreground='red'><sup></sup></span>",
        "dnd-inhibited-none": ""
      },
      "return-type": "json",
      "exec-if": "which swaync-client",
      "exec": "swaync-client -swb",
      "on-click": "swaync-client -t -sw",
      "on-click-right": "swaync-client -d -sw",
      "escape": true
    },

    "battery": {
      "states": {
        "warning": 30,
        "critical": 15
      },
      "format": "{icon} {capacity}%",
      "format-charging": "󰂄 {capacity}%",
      "format-plugged": "󱘖 {capacity}%",
      "format-icons": [
        "󰁺",
      "󰁻",
      "󰁼",
      "󰁽",
      "󰁾",
      "󰁿",
      "󰂀",
      "󰂁",
      "󰂂",
      "󰁹"
      ],
      "on-click": "",
      "tooltip": false,
      "interval": 1
    }
}
