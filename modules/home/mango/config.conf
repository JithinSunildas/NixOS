# === Suckless Config ===

# === Display ===
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.25
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# === Trackpad Tuning ===
trackpad_natural_scrolling=1
trackpad_accel_profile=2
trackpad_accel_speed=1.0
trackpad_scroll_factor=10.0
sloppyfocus=0
edge_scroller_pointer_focus=0
# === Keyboard ===
xkb_rules_options=compose:ralt

# Here is a bar
exec-once=waybar
exec-once=swayosd-server
exec-once=swaync
exec-once=awww-daemon

# === Binds ===
bind=SUPER+Shift,r,reload_config

# Apps
bind=SUPER,Return,spawn,/home/tikhaboom/.nix-profile/bin/ghostty
bind=SUPER,space,spawn_shell,bash -c 'pkill fuzzel || fuzzel'
bind=SUPER+Shift,space,spawn_shell,bash -c 'pkill waybar || waybar'
bind=SUPER,e,spawn,nautilus
bind=SUPER,b,spawn,zen-beta
bind=SUPER,w,spawn,/home/tikhaboom/.nix-profile/bin/ghostty -e nmtui
bind=SUPER+Shift,w,spawn,/home/tikhaboom/.nix-profile/bin/ghostty -e wifitui
bind=SUPER,y,spawn,/home/tikhaboom/.nix-profile/bin/ghostty -e yazi
bind=SUPER+Shift,c,spawn,gnome-calculator

# Views
bind=SUPER,1,comboview,1
bind=SUPER,2,comboview,2
bind=SUPER,3,comboview,3
bind=SUPER,4,comboview,4
bind=SUPER,5,comboview,5
bind=SUPER,6,comboview,6
bind=SUPER,7,comboview,7
bind=SUPER,8,comboview,8
bind=SUPER,9,comboview,9

# switch window focus
bind=SUPER,n,viewtoright
bind=SUPER,p,viewtoleft
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind-SUPER,Tab,toggleoverview

# DWM style binds
bind=SUPER,i,incnmaster,+1
bind=SUPER,d,incnmaster,-1
bind=SUPER,left,setmfact,-0.05
bind=SUPER,right,setmfact,+0.05
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+CTRL+shift,l,tagmon,right,0
bind=SUPER,q,killclient

# Swap windows
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+Shift,1,tag,1
bind=SUPER+Shift,2,tag,2
bind=SUPER+Shift,3,tag,3
bind=SUPER+Shift,4,tag,4
bind=SUPER+Shift,5,tag,5
bind=SUPER+Shift,6,tag,6
bind=SUPER+Shift,7,tag,7
bind=SUPER+Shift,8,tag,8
bind=SUPER+Shift,9,tag,9

# Layouts
bind=SUPER,f,togglemaximizescreen
bind=SUPER+Shift,f,togglefullscreen
bind=SUPER,t,setlayout,tile
bind=SUPER,d,setlayout,vertical_dwindle
bind=SUPER,m,setlayout,monocle
bind=SUPER,v,setlayout,vertical_grid
bind=SUPER,x,setlayout,scroller

# System control
bind=Alt,space,spawn,wlogout
bind=None,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume raise
bind=None,XF86AudioLowerVolume,spawn,swayosd-client --output-volume lower
bind=None,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
bind=None,XF86MonBrightnessUp,spawn,swayosd-client --brightness raise
bind=None,XF86MonBrightnessDown,spawn,swayosd-client --brightness lower
bind=NONE,Print,spawn_shell,grim $HOME/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png
bind=SHIFT,Print,spawn_shell,g=$(slurp -d) && [ -n "$g" ] && grim -g "$g" $HOME/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png
bind=ALT,Print,spawn_shell,grim -c $HOME/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png
bind=CTRL,Print,spawn_shell,f=$(mktemp -t screenshot-XXXXXX.png) && grim "$f" && wl-copy < "$f" && rm -f "$f"
bind=SUPER,Print,spawn_shell,f=$HOME/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png && grim "$f" && satty --filename "$f" --output-filename "$f" --actions-on-enter save-to-file --early-exit

# === Gestures ===

# 3-finger: Window focus
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left
gesturebind=none,up,3,viewtoright
gesturebind=none,down,3,viewtoleft
# 4-finger: Workspace navigation
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# Animations
animations=0
gappih=10
gappiv=10
gappoh=10
gappov=10
borderpx=0
no_border_when_single=1

blur=1
blur_optimized=1
focused_opacity=0.8
unfocused_opacity=0.3

# Turn off silly defaults
new_is_master=0
enable_hotarea=0
warpcursor=1
sloppyfocus=1
axis_bind_apply_timeout=100
drag_tile_to_tile=1
enable_floating_snap=0
snap_distance=30

