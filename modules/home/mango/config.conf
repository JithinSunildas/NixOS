# ==========================================
# MangoWC Minimal Configuration
# ==========================================

# --- Visual Gimmicks (Disabled for Performance) ---
animations=0
blur=0
shadows=0
layer_shadows=0
border_radius=0

border_width=2
focused_border_color=0xffc87f
unfocused_border_color=0x505050
focused_opacity=1.0
unfocused_opacity=1.0

# --- Layout: Scroller (Niri-like workflow) ---
layout=scroller
scroller_default_proportion=0.5
gaps_in=7
gaps_out=7

# --- Input / Hardware ---
xkb_rules_layout=us
xkb_rules_options=compose:ralt

# --- Autostart & Environment ---
# Push Wayland vars to dbus (Fixes Waybar and Ghostty OpenGL context)
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=mango
exec-once=waybar
exec-once=swayosd-server
exec-once=awww-daemon
exec-once=swaync

# ==========================================
# Keybinds (Mapped from Niri)
# Format: bind=MOD,KEY,COMMAND,ARGUMENTS
# ==========================================

# Applications
bind=Super,Return,spawn,ghostty
bind=Super,e,spawn,nautilus
bind=Super,b,spawn,zen-beta
bind=Super,o,spawn,obsidian
bind=Super,n,spawn,ghostty -e nmtui
bind=Super,y,spawn,ghostty -e yazi
bind=Super+Shift,n,spawn,ghostty -e nvim
bind=Super+Shift,c,spawn,gnome-calculator
bind=Super,space,spawn,pkill fuzzel || fuzzel
bind=Super+Shift,space,spawn,pkill waybar || waybar

# Core Window Management
bind=Super,q,killclient
bind=Super+Shift,f,togglefullscreen
bind=Super,v,togglefloating

# Navigation (hjkl)
bind=Super,h,focusdir,left
bind=Super,j,focusdir,down
bind=Super,k,focusdir,up
bind=Super,l,focusdir,right

# Move Windows (hjkl)
bind=Super+Shift,h,movedir,left
bind=Super+Shift,j,movedir,down
bind=Super+Shift,k,movedir,up
bind=Super+Shift,l,movedir,right

# System / Hardware Binds
bind=Super+Shift,r,reload
bind=Alt,space,spawn,pkill wlogout || wlogout
bind=None,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume raise
bind=None,XF86AudioLowerVolume,spawn,swayosd-client --output-volume lower
bind=None,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
bind=None,XF86MonBrightnessUp,spawn,swayosd-client --brightness raise
bind=None,XF86MonBrightnessDown,spawn,swayosd-client --brightness lower

# Workspaces / Tags
bind=Super,1,view,1
bind=Super,2,view,2
bind=Super,3,view,3
bind=Super,4,view,4
bind=Super,5,view,5
bind=Super,6,view,6
bind=Super,7,view,7
bind=Super,8,view,8
bind=Super,9,view,9

# Move Window to Tag
bind=Super+Shift,1,tag,1
bind=Super+Shift,2,tag,2
bind=Super+Shift,3,tag,3
bind=Super+Shift,4,tag,4
bind=Super+Shift,5,tag,5
bind=Super+Shift,6,tag,6
bind=Super+Shift,7,tag,7
bind=Super+Shift,8,tag,8
bind=Super+Shift,9,tag,9
